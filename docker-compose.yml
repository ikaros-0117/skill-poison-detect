services:
  engine:
    build:
      context: .
      dockerfile: skillspector-engine/Dockerfile
    image: skillspector-engine:local
    environment:
      SKILLSPECTOR_PROVIDER: openai
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SKILLSPECTOR_MODEL: ${SKILLSPECTOR_MODEL:-}
      ENGINE_MAX_CONCURRENT_SCANS: 8
    volumes:
      - skill-data:/data
    ports:
      - "8000:8000"

  server:
    build:
      context: ./SkillDetectServer
      dockerfile: Dockerfile
    image: skilldetect-server:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skilldetect?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: skilldetect
      SPRING_DATASOURCE_PASSWORD: skilldetect
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SCAN_ENGINE_BASE_URL: http://engine:8000
      SCAN_ENGINE_TIMEOUT_SECONDS: 720
      SCAN_STORAGE_BASE_DIR: /data
      SCAN_CONCURRENCY_MAX_ACTIVE: 8
      SCAN_RISK_THRESHOLD: 50
      SECURITY_ENABLED: false
    volumes:
      - skill-data:/data
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: skilldetect
      MYSQL_USER: skilldetect
      MYSQL_PASSWORD: skilldetect
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./SkillDetectServer/docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  skill-data:
  mysql-data:
  redis-data:
