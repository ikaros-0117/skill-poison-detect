server:
  port: 8080

spring:
  application:
    name: skilldetect-server
  datasource:
    url: jdbc:mysql://localhost:3306/skilldetect?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: skilldetect
    password: skilldetect
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

scan:
  risk-threshold: 50
  concurrency:
    max-active: 8
  engine:
    base-url: http://localhost:8000
    timeout-seconds: 720
    circuit-failure-threshold: 5
    circuit-open-seconds: 60
  storage:
    base-dir: /data
  retention-days: 30

security:
  enabled: false

rate-limit:
  enabled: true
  window-seconds: 60
  hmi-requests-per-minute: 120
  m2m-requests-per-minute: 60
